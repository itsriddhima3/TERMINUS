user_visible_outputs = [
  "/app/output/matrix_report.json",
  "/app/output/trace_bundle.jsonl",
  "/app/data/seed_scenarios.json",
  "/app/bin/netplay_matrix",
]

internal_harness_files = [
  "/app/bin/netplay_matrix",
]

[structured_outputs.matrix_report]
target = "/app/output/matrix_report.json"
format = "json"
instruction_checks = [
  "schema_version",
  "scenarios",
  "per_scenario",
  "state_digest_hex",
  "tail_projection",
  "rng_channel_totals",
  "replay_format_revision",
  "reader_lowest_revision",
  "duplicate_match",
  "straight_run_a",
  "straight_run_b",
  "roundtrip_match",
  "roundtrip_digest",
  "resume_ok",
  "baseline_digest_hex",
  "legacy_revision_read",
]

[structured_outputs.trace_bundle]
target = "/app/output/trace_bundle.jsonl"
format = "jsonl"
instruction_checks = ["scenario_id", "tick", "merged_dx", "positions", "entropy_mix"]
