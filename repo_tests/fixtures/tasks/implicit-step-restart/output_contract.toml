user_visible_outputs = [
  "/app/out/restart_report.json",
  "/app/out/persistence_audit.log",
  "/app/work/snapshot.bin",
]

internal_harness_files = [
  "/app/build/dem_runner",
]

[structured_outputs.restart_report]
target = "/app/out/restart_report.json"
format = "json"
instruction_checks = [
  "operator_signature_checksum",
  "schedules",
  "accepted_steps",
  "rejected_steps",
  "newton_iterations",
  "event_time",
  "integrity_probes",
  "stale_operator_bundle_rejected",
  "stale_damping_bundle_rejected",
]

[structured_outputs.persistence_audit]
target = "/app/out/persistence_audit.log"
format = "text-log"
instruction_checks = [
  "ACCEPTED",
  "REJECTED",
  "OK",
  "SIGNATURE_MISMATCH",
  "VERSION_MISMATCH",
  "CORRUPT_BUNDLE",
  "/app/work/snapshot.bin",
]
