[package]
name = "m7desk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "m7desk"
path = "src/main.rs"

[dependencies]
k9m = { path = "../k9m" }
r2n = { path = "../r2n" }
p4v = { path = "../p4v" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1.10"
toml = "0.8"

[profile.release]
debug = 1
