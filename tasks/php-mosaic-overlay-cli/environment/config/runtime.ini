; overlay-inspect runtime configuration
;
; The CLI loads this INI at Bootstrap and threads the parsed values
; through the engine. Values are non-secret and safe to commit.

[paths]
db_path = /app/state/challenges.db
asset_root = /app/assets
runtime_root = /app/runtime

[clock]
default_mode = wallclock
scripted_step_ms = 1

[render]
glyph_palette = " .:-=+*#%@"

[debug]
echo_log = 0
component_breakdown = 0
